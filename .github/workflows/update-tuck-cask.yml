name: Update Tuck Stable Cask

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tuck-stable-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Stable appcast and update Cask
        run: python3 scripts/update-tuck-cask.py

      - name: Validate and publish any update
        run: |
          ruby -c Casks/tuck-menu-bar.rb
          if git diff --quiet -- Casks/tuck-menu-bar.rb; then
            echo "Tuck Cask is already current."
            exit 0
          fi

          version=$(ruby -ne 'puts $1 if $_ =~ /^  version "([^"]+)"/' Casks/tuck-menu-bar.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tuck-menu-bar.rb
          git commit -m "Update Tuck Cask to ${version}"
          git push
